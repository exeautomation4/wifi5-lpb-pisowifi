# ==============================================================================
# WiFi5 LPB Piso WiFi - dnsmasq Hotspot Configuration
# Location: /etc/dnsmasq.d/wifi5-piso.conf
# ==============================================================================

# Interface binding
interface=wlan0
listen-address=10.0.0.1
bind-interfaces

# DHCP Server Settings
# IP Range: 10.0.0.10 to 10.0.0.250 with 1 hour lease duration
dhcp-range=10.0.0.10,10.0.0.250,255.255.255.0,1h

# DHCP Gateway & DNS Options
dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1,8.8.8.8,1.1.1.1
dhcp-option=option:ntp-server,10.0.0.1

# DNS Captive Portal Interception (Redirect common portal URLs)
address=/logout/10.0.0.1
address=/hotspot.wifi5/10.0.0.1
address=/vendo.net/10.0.0.1
address=/login.portal/10.0.0.1

# Cache Optimization for SBC Flash memory
cache-size=1000
no-resolv
server=8.8.8.8
server=1.1.1.1
log-queries
log-facility=/var/log/dnsmasq.log
